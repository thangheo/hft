syntax = "proto3";

package hft;

message OrderBookEntry {
  double price = 1;
  double quantity = 2;
}

message MarketData {
  string exchange = 1;
  string symbol = 2;
  repeated OrderBookEntry bids = 3;
  repeated OrderBookEntry asks = 4;
  int64 timestamp = 5; // Unix timestamp in milliseconds
}
