syntax = "proto3";

package hft;

enum OrderStatus {
  NEW = 0;
  PARTIALLY_FILLED = 1;
  FILLED = 2;
  CANCELED = 3;
  REJECTED = 4;
}

message Order {
  string order_id = 1;
  string client_order_id = 2;
  string symbol = 3;
  string side = 4; // "BUY" or "SELL"
  double price = 5;
  double quantity = 6;
  OrderStatus status = 7;
  int64 timestamp = 8; // Unix timestamp in milliseconds
}
